name: Submission checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build -f Dockerfile.test-runner -t causaltrace-test-runner:local .
      - name: Real container checks with mocked inference
        env:
          CAUSALTRACE_HISTORY_DOCKER_TESTS: '1'
          CAUSALTRACE_RELEASE_DOCKER_TESTS: '1'
          CAUSALTRACE_ACTIVE_CONTROL_DOCKER_TESTS: '1'
          CAUSALTRACE_DOCKER_TESTS: '1'
        run: >-
          python -m pytest tests/test_tested_history.py tests/test_release_investigation.py
          tests/test_active_operations.py tests/test_diagnostic_suggestions.py -q -k real
